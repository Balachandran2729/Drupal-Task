user_crud.list:
  path: '/admin/user-crud'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudController::list'
    _title: 'User CRUD'
  requirements:
    _permission: 'manage user crud'
  options:
    _admin_route: TRUE
    
user_crud.add:
  path: '/admin/user-crud/add'
  defaults:
    _form: '\Drupal\user_crud\Form\UserCrudAddForm'
    _title: 'Add User'
  requirements:
    _permission: 'manage user crud'
  options:
    _admin_route: TRUE

user_crud.edit:
  path: '/admin/user-crud/{user}/edit'
  defaults:
    _form: '\Drupal\user_crud\Form\UserCrudEditForm'
    _title: 'Edit User'
  requirements:
    _permission: 'manage user crud'
    user: \d+
  options:
    _admin_route: TRUE
    parameters:
      user:
        type: entity:user

user_crud.delete:
  path: '/admin/user-crud/{user}/delete'
  defaults:
    _form: '\Drupal\user_crud\Form\UserCrudDeleteForm'
    _title: 'Delete User'
  requirements:
    _permission: 'manage user crud'
    user: \d+
  options:
    _admin_route: TRUE
    parameters:
      user:
        type: entity:user

user_crud.hello:
  path: '/admin/user-crud/hello'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudController::hello'
    _title: 'Hello User CRUD'
  requirements:
    _permission: 'manage user crud'
  options:
    _admin_route: TRUE

user_crud.restAPIdelete:
  path: '/api/user-crud/rest-api/delete/{user}'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudRestAPIController::restAPIdelete'
    _title: 'REST API Delete User'
  methods: [DELETE]
  requirements:
    _access: 'TRUE'
    user: \d+
  options:
    _admin_route: false

user_crud.restAPIedit:
  path: '/api/user-crud/rest-api/edit/{user}'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudRestAPIController::restAPIedit'
  methods: [PATCH]
  requirements:
    _access: 'TRUE'
    user: \d+
  options:
    _admin_route: FALSE

user_crud.restAPIeditPut:
  path: '/api/user-crud/rest-api/edit/{user}'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudRestAPIController::restAPIeditPut'
  methods: [PUT]
  requirements:
    _permission: 'access content'
    user: '\d+'
  options:
    _admin_route: false
    
user_crud.restAPIcreate:
  path: '/api/user-crud/rest-api/create'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudRestAPIController::restAPIcreate'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _admin_route: FALSE
     
user_crud.restAPIread:
  path: '/api/user-crud/rest-api/read'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudRestAPIController::restApiRead'
    _title: 'Read Users'
  requirements:
    _access: 'TRUE'
  options:
    _admin_route: FALSE

user_crud.refreshToken:

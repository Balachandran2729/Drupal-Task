user_crud.list:
  path: '/admin/user-crud'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudController::list'
    _title: 'User CRUD'
  requirements:
    _permission: 'manage user crud'
  options:
    _admin_route: TRUE

user_crud.add:
  path: '/admin/user-crud/add'
  defaults:
    _form: '\Drupal\user_crud\Form\UserCrudAddForm'
    _title: 'Add User'
  requirements:
    _permission: 'manage user crud'
  options:
    _admin_route: TRUE

user_crud.edit:
  path: '/admin/user-crud/{user}/edit'
  defaults:
    _form: '\Drupal\user_crud\Form\UserCrudEditForm'
    _title: 'Edit User'
  requirements:
    _permission: 'manage user crud'
    user: \d+
  options:
    _admin_route: TRUE
    parameters:
      user:
        type: entity:user

user_crud.delete:
  path: '/admin/user-crud/{user}/delete'
  defaults:
    _controller: '\Drupal\user_crud\Controller\UserCrudController::delete'
    _title: 'Delete User'
  requirements:
    _permission: 'manage user crud'
  options:
    _admin_route: TRUE